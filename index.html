<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Iron Ledger — Nhật ký tập</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5DA9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#F7FAFD; --surface:#FFFFFF; --raised:#F4F7FA;
    --border:#E8EEF5; --border-soft:#EEF6FF;
    --text:#111827; --text-dim:#6B7280; --text-faint:#9AA8B6;
    --accent:#5DA9F6; --accent-dim:#A9D5FF; --accent-soft:#DCEEFF; --accent-deep:#2E6FD1;
    --success:#6FD19C; --warning:#FFB870; --danger:#FF8A95;
    --hero-a:#6FB6FA; --hero-b:#3E7FE6;
    --nav-glass:rgba(255,255,255,0.88);
    --pill-text:#1D4ED8;
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --bg:#10161D; --surface:#18212B; --raised:#202C38;
    --border:#273544; --border-soft:#233040;
    --text:#F7FAFC; --text-dim:#9AA8B6; --text-faint:#6B7A8A;
    --accent:#72B9FF; --accent-dim:#3A5A82; --accent-soft:rgba(114,185,255,0.16); --accent-deep:#9CCBFF;
    --success:#6FD19C; --warning:#FFB870; --danger:#FF8A95;
    --hero-a:#4C8DFF; --hero-b:#2A5BC7;
    --nav-glass:rgba(24,33,43,0.86);
    --pill-text:#1D4ED8;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);touch-action:manipulation;}
  button{touch-action:manipulation;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--text);
    transition:background 200ms ease, color 200ms ease;
  }
  button,input{font-family:inherit;}
  button{cursor:pointer;}
  .mono{font-family:ui-monospace,'SF Mono','Menlo',monospace;font-variant-numeric:tabular-nums;}
  .frame{width:100%;max-width:480px;height:100vh;max-height:900px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;}
  .screen{height:100%;position:relative;}
  .scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .header{padding:20px 20px 16px;display:flex;align-items:flex-end;justify-content:space-between;}
  .header-title{font-size:26px;font-weight:800;letter-spacing:-0.02em;color:var(--text);}
  .header-subtitle{font-size:13px;color:var(--text-dim);margin-top:2px;}
  .section-label{font-size:12px;font-weight:700;color:var(--text-dim);letter-spacing:0.03em;margin-bottom:10px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(17,24,39,0.03), 0 8px 20px -12px rgba(17,24,39,0.10);}
  .card + .card{margin-top:10px;}
  .clickable{cursor:pointer;}
  .input{width:100%;padding:12px 14px;border-radius:14px;background:var(--raised);border:1px solid var(--border);color:var(--text);font-size:15px;outline:none;transition:border-color 180ms ease, box-shadow 180ms ease;}
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .btn-primary{width:100%;min-height:52px;padding:14px 18px;border-radius:16px;border:none;background:var(--accent);color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity 180ms ease, transform 150ms ease;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{background:var(--border);color:var(--text-faint);opacity:.7;cursor:default;}
  .dashed-btn{width:100%;padding:14px;border-radius:16px;margin-top:8px;border:1.5px dashed var(--accent-dim);background:var(--border-soft);color:var(--accent-deep);font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;}
  .link-btn{font-size:13px;color:var(--accent-deep);background:none;border:none;font-weight:600;padding:4px 0;}
  .link-btn.faint{color:var(--text-faint);font-weight:400;}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:transparent;border:none;color:var(--text-dim);font-size:16px;transition:background 150ms ease;}
  .icon-btn.danger{color:var(--danger);}
  .icon-btn.accent{color:var(--accent-deep);}
  .set-row{display:grid;grid-template-columns:24px 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:6px;}
  .set-input{width:100%;padding:9px 8px;border-radius:12px;background:var(--raised);border:1px solid var(--border);color:var(--text);font-size:15px;text-align:center;outline:none;font-family:ui-monospace,monospace;transition:border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;}
  .set-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .set-input.done{border-color:var(--accent-dim);background:var(--accent-soft);}
  .set-check{width:44px;height:44px;border-radius:12px;border:none;background:var(--raised);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:17px;touch-action:manipulation;transition:background 180ms ease, color 180ms ease;}
  .set-check.done{background:var(--accent);color:#FFFFFF;}
  .set-del{width:44px;height:44px;border-radius:12px;border:none;background:var(--raised);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:15px;touch-action:manipulation;transition:background 180ms ease, color 180ms ease;}
  .set-del:active{background:var(--danger);color:#FFFFFF;}
  .plate-stack{display:flex;gap:4px;}
  .plate{width:16px;height:5px;border-radius:2px;background:var(--border);}
  .plate.filled{background:var(--accent);}
  .bottom-nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:6px 0;color:var(--text-faint);}
  .nav-item.active{color:var(--accent-deep);}
  .nav-icon{font-size:18px;}
  .nav-label{font-size:10.5px;font-weight:500;}
  .nav-item.active .nav-label{font-weight:700;}
  .chip{padding:8px 14px;border-radius:20px;white-space:nowrap;background:var(--border-soft);color:var(--text-dim);border:none;font-size:13px;font-weight:600;flex:none;}
  .chip.active{background:var(--accent);color:#FFFFFF;}
  .stat-row{display:flex;gap:10px;margin-bottom:16px;}
  .stat-card{padding:14px 12px;flex:1;background:var(--surface);border:1px solid var(--border);border-radius:18px;text-align:center;box-shadow:0 1px 2px rgba(17,24,39,0.03), 0 6px 14px -10px rgba(17,24,39,0.10);}
  .stat-label{font-size:10.5px;color:var(--text-dim);margin-bottom:6px;font-weight:700;letter-spacing:0.03em;}
  .stat-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,0.45);display:flex;align-items:flex-end;z-index:50;}
  .sheet{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border:1px solid var(--border);border-bottom:none;max-height:82vh;}
  .picker-item{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:14px;background:var(--raised);border:1px solid transparent;color:var(--text);font-size:14.5px;font-weight:500;text-align:left;width:100%;margin-bottom:6px;}
  .picker-item.picked{background:var(--accent-soft);border-color:var(--accent-dim);color:var(--accent-deep);}
  .btn-accent-small{padding:0 18px;border-radius:14px;border:none;background:var(--accent);color:#FFFFFF;font-weight:700;font-size:14px;}
  .detail-overlay{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
  .empty{text-align:center;padding:56px 24px;color:var(--text-dim);}
  .empty-icon{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px;}
  .empty-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;}
  .empty-sub{font-size:13px;line-height:1.5;}
  .mini-btn{width:26px;height:26px;border-radius:8px;background:var(--raised);border:none;color:var(--text-dim);}
  .mode-toggle{display:flex;gap:6px;margin-bottom:10px;}
  .mode-btn{padding:6px 11px;border-radius:10px;background:var(--raised);border:none;color:var(--text-dim);font-size:11.5px;font-weight:600;}
  .mode-btn.active{background:var(--accent);color:#FFFFFF;}

  /* Hero card + day strip */
  .hero-card{background:linear-gradient(160deg, var(--hero-a) 0%, var(--hero-b) 100%);border-radius:24px;margin:16px 20px 0;padding:20px 18px 18px;color:#fff;box-shadow:0 16px 28px -14px rgba(62,127,230,0.55);}
  .day-strip{display:flex;justify-content:space-between;margin-bottom:16px;}
  .day-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;opacity:.78;width:30px;}
  .day-item.today{opacity:1;}
  .day-weekday{font-size:10px;text-transform:uppercase;letter-spacing:0.04em;}
  .day-num{font-size:14px;font-weight:600;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .day-item.today .day-num{background:rgba(255,255,255,0.3);font-weight:800;}
  .day-dot{width:4px;height:4px;border-radius:50%;background:#fff;margin-top:1px;}
  .day-icon-img{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,0.6);display:block;}
  .segmented{display:inline-flex;background:rgba(255,255,255,0.2);border-radius:20px;padding:3px;margin-bottom:18px;}
  .segmented-option{border:none;background:none;color:rgba(255,255,255,0.8);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:16px;}
  .segmented-option.active{background:#fff;color:var(--pill-text);}
  .hero-big{font-size:40px;font-weight:800;letter-spacing:-0.02em;line-height:1.15;font-variant-numeric:tabular-nums;}
  .hero-big-label{font-size:13px;opacity:.9;margin-top:6px;}

  /* Light-blue highlight card (entered data / important stat) */
  .pastel-card{border-radius:18px;padding:14px;background:var(--accent-soft);color:var(--accent-deep);}

  /* Day cards (Dữ liệu tab) - distinct colors per day, by design request */
  .day-card{border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(17,24,39,0.05), 0 8px 20px -12px rgba(17,24,39,0.15);}
  .day-card-blue{background:#DCEEFF;color:#1D4ED8;}
  .day-card-peach{background:#FFE7D3;color:#C2410C;}
  .day-card-mint{background:#DAF5E6;color:#047857;}
  .day-card-purple{background:#EBE2FF;color:#6D28D9;}
  .day-card-pink{background:#FFE0EB;color:#BE185D;}
  .day-card-yellow{background:#FFF2C2;color:#92700C;}
  .day-card .card{background:rgba(255,255,255,0.68);box-shadow:none;}
  .day-card .icon-btn{color:inherit;}
  .day-card .info-card-label{color:inherit;opacity:.75;}
  .day-card .input{background:rgba(255,255,255,0.75);color:#111827;}

  /* Info cards */
  .info-card-row{display:flex;gap:10px;padding:20px 20px 0;}
  .info-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(17,24,39,0.03), 0 6px 14px -10px rgba(17,24,39,0.10);}
  .info-card-label{font-size:11px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .info-card-value{font-size:16px;font-weight:800;color:var(--text);line-height:1.25;}
  .info-card-foot{font-size:11.5px;color:var(--text-faint);margin-top:6px;}

  /* Bottom nav + FAB */
  .bottom-nav-wrap{position:absolute;bottom:0;left:0;right:0;}
  .bottom-nav{display:flex;align-items:center;background:var(--nav-glass);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--border);border-radius:24px 24px 0 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(17,24,39,0.05);position:relative;}
  .nav-items-wrap{display:flex;flex:1;padding-right:54px;}
  .fab{position:absolute;right:18px;top:-22px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:400;box-shadow:0 10px 20px -4px rgba(93,169,246,0.55);}
  .theme-toggle{width:38px;height:38px;border-radius:12px;background:var(--raised);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;transition:background 200ms ease;}
</style>
</head>

function resizeImageFile(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement("canvas");
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        } catch (err) { reject(err); }
      };
      img.onerror = () => reject(new Error("Không đọc được ảnh (định dạng không hỗ trợ)"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Không đọc được file"));
    reader.readAsDataURL(file);
  });
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = () => reject(new Error("Không đọc được file"));
    reader.readAsDataURL(file);
  });
}

}

/* ============ STORAGE ============ */
function hasArtifactStorage() {
  return typeof window !== "undefined" && window.storage && typeof window.storage.get === "function" && typeof window.storage.set === "function";
}
async function storageGetRaw(key) {
  if (hasArtifactStorage()) {
    try {
      const res = await window.storage.get(key, false);
      if (res && res.value) return res.value;
    } catch (e) { /* fall through to localStorage */ }
  }
  try {
    const raw = localStorage.getItem(key);
    if (raw !== null) return raw;
  } catch (e) { /* localStorage unavailable (e.g. private mode) */ }
  return null;
}
async function storageSetRaw(key, value) {
  let ok = false;
  if (hasArtifactStorage()) {
    try {
      await window.storage.set(key, value, false);
      ok = true;
    } catch (e) { /* fall through, still try localStorage below */ }
  }
  try {
    localStorage.setItem(key, value);
    ok = true;
  } catch (e) { /* localStorage unavailable */ }
  if (!ok) throw new Error("Không thể lưu vào bất kỳ nơi lưu trữ nào");
}
async function loadData() {
  try {
    const raw = await storageGetRaw(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* not found yet */ }
  return { exercises: DEFAULT_EXERCISES, routines: [], workouts: [], theme: "light", dayIcons: {} };
}

let saveTimer = null;
let saveInFlight = false;
let saveQueuedAgain = false;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { flushSave(2); }, 400);
}
async function flushSave(retriesLeft) {
  if (saveInFlight) { saveQueuedAgain = true; return; }
  saveInFlight = true;
  const payload = JSON.stringify({ exercises: state.exercises, routines: state.routines, workouts: state.workouts, theme: state.theme, dayIcons: state.dayIcons });
  try {
    await storageSetRaw(STORAGE_KEY, payload);
  } catch (e) {
    console.error("Lỗi lưu dữ liệu:", e);
    if (retriesLeft > 0) {
      saveInFlight = false;
      setTimeout(() => flushSave(retriesLeft - 1), 900);
      return;
    }
  }
  saveInFlight = false;
  if (saveQueuedAgain) { saveQueuedAgain = false; scheduleSave(); }
}
document.addEventListener("visibilitychange", () => {

function buildLineChartSVG(points) {
  if (!points || points.length === 0) {
    return '<div style="padding:40px 0;text-align:center;color:var(--text-faint);font-size:13px;">Chưa đủ dữ liệu để vẽ biểu đồ</div>';
  }
  const W = 320, H = 190, padL = 34, padR = 14, padT = 16, padB = 26;
  const values = points.map((p) => p.value);
  let min = Math.min(...values), max = Math.max(...values);
  if (min === max) { min -= 5; max += 5; }
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xStep = points.length > 1 ? innerW / (points.length - 1) : 0;
  const coords = points.map((p, i) => ({
    x: padL + i * xStep,
    y: padT + innerH - ((p.value - min) / (max - min)) * innerH,
    label: p.label, value: p.value,
  }));
  const poly = coords.map((c) => c.x.toFixed(1) + "," + c.y.toFixed(1)).join(" ");
  const labelEvery = Math.max(1, Math.ceil(coords.length / 6));
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;">';
  svg += '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (H - padB) + '" stroke="var(--border-soft)" />';
  svg += '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="var(--border-soft)" />';
  svg += '<text x="4" y="' + (padT + 4) + '" font-size="9" fill="var(--text-faint)">' + Math.round(max) + '</text>';
  svg += '<text x="4" y="' + (H - padB) + '" font-size="9" fill="var(--text-faint)">' + Math.round(min) + '</text>';
  svg += '<polyline points="' + poly + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />';
  coords.forEach((c) => {
    svg += '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="3.5" fill="var(--accent)"><title>' + esc(c.label) + ": " + c.value + 'kg</title></circle>';
  });
  coords.forEach((c, i) => {
    if (i % labelEvery === 0) {
      svg += '<text x="' + c.x.toFixed(1) + '" y="' + (H - 8) + '" font-size="9" fill="var(--text-faint)" text-anchor="middle">' + esc(c.label) + '</text>';
    }
  });
  svg += "</svg>";
  return svg;
}

  html += '<div style="padding:0 20px 16px;"><button type="button" class="dashed-btn" style="margin-top:0;" data-action="log-past-workout">+ Ghi buổi tập đã tập</button></div>';
  html += '<div style="padding:0 20px 100px;">';
  if (dates.length === 0) html += renderEmpty("🕘", "Chưa có buổi tập nào", "Hoàn thành buổi đầu tiên để thấy lịch sử tại đây.");
  dates.forEach((date, i) => {
    const color = DAY_CARD_COLORS[i % DAY_CARD_COLORS.length];
    const isOpen = state.dataExpandedDate === date;
    const dayWorkouts = state.workouts.filter((w) => w.date === date);
    const exCount = dayWorkouts.reduce((a, w) => a + w.exercises.length, 0);
    const doneSetCount = dayWorkouts.reduce((a, w) => a + countDoneSets(w), 0);
    html += '<div class="day-card day-card-' + color + '" style="margin-bottom:10px;">';
    html += '<div class="clickable" data-action="data-toggle-day" data-date="' + date + '" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;">';

    html += '<div style="display:flex;align-items:center;gap:4px;">';
    html += '<button type="button" class="icon-btn" data-action="delete-day" data-date="' + date + '" title="Xoá ngày này" style="color:inherit;">🗑</button>';
    html += '<span style="font-size:18px;opacity:.7;">' + (isOpen ? "▾" : "▸") + "</span></div></div>";
    if (isOpen) {
      html += '<div style="padding:0 14px 14px;">';
      const w = getOrCreateDayWorkout(date);
      w.exercises.forEach((se, exIdx) => { html += renderSetCard(se, exIdx, {}); });
      if (w.exercises.length === 0) html += '<div style="font-size:13px;opacity:.75;padding:8px 2px 12px;">Chưa có bài tập nào trong ngày này.</div>';
      html += '<button type="button" class="dashed-btn" data-action="open-picker" data-context="history" style="background:rgba(255,255,255,0.5);">+ Thêm bài tập</button>';
      html += '<button type="button" class="btn-primary" data-action="data-toggle-day" data-date="' + date + '" style="margin-top:10px;background:rgba(17,24,39,0.85);">✓ Lưu</button>';
      html += "</div>";
    }
    html += "</div>";
  });
  html += "</div></div>";
  html += renderBottomNav();
  return html;
}

/* ============ TAB: PROGRESS ============ */
function renderProgressTab() {
  const list = getExercisesWithData();
  if (!state.progressSelectedId && list.length > 0) state.progressSelectedId = list[0].id;
  const points = getProgressPoints(state.progressSelectedId);
  const stats = points.length ? { best: Math.max(...points.map((p) => p.value)), latest: points[points.length - 1].value, first: points[0].value } : null;
  let html = '<div class="scroll" id="tab-scroll"><div class="header"><div><div class="header-title">Tiến bộ</div><div class="header-subtitle">Theo dõi mức tạ theo thời gian</div></div>' + renderThemeToggle() + "</div>";

    html += renderEmpty("📈", "Chưa có dữ liệu", "Hoàn thành vài buổi tập để xem biểu đồ tiến bộ.");
  } else {
    html += '<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;">';
    list.forEach((e) => {
      html += '<button type="button" class="chip ' + (state.progressSelectedId === e.id ? "active" : "") + '" data-action="select-progress" data-id="' + e.id + '">' + esc(e.name) + "</button>";
    });

      html += '<div class="stat-card"><div class="stat-label">TỐT NHẤT</div><div class="stat-value" style="color:var(--accent-deep);">' + stats.best + '<span style="font-size:13px;font-weight:700;">kg</span></div></div>';
      html += '<div class="stat-card"><div class="stat-label">GẦN NHẤT</div><div class="stat-value" style="color:var(--text);">' + stats.latest + '<span style="font-size:13px;font-weight:700;">kg</span></div></div>';
      html += '<div class="stat-card"><div class="stat-label">TĂNG</div><div class="stat-value" style="color:var(--success);">' + (diff >= 0 ? "+" : "") + diff + '<span style="font-size:13px;font-weight:700;">kg</span></div></div>';
      html += "</div>";
    }
    html += '<div class="card" style="padding:16px 8px 8px;">' + buildLineChartSVG(points) + "</div>";
  }
  html += "</div></div>";
  html += renderBottomNav();
  return html;
}

function renderActiveWorkout() {

  html += '<div style="padding:0 20px 10px;"><div style="font-size:20px;font-weight:800;">' + esc(s.name) + '</div>';

  html += '<button type="button" class="btn-primary" data-action="finish-workout" ' + (canFinish ? "" : "disabled") + '>✓ Hoàn thành buổi tập</button></div>';

function renderSetCard(se, exIdx, opts) {

  html += '<button type="button" class="mini-btn" data-action="ex-move-up" data-ex="' + exIdx + '" ' + (exIdx === 0 ? "disabled" : "") + ' style="opacity:' + (exIdx === 0 ? "0.3" : "1") + ';">↑</button>';
  html += '<button type="button" class="mini-btn" data-action="ex-move-down" data-ex="' + exIdx + '" ' + (exIdx === total - 1 ? "disabled" : "") + ' style="opacity:' + (exIdx === total - 1 ? "0.3" : "1") + ';">↓</button>';

      if (se.repRange) bits.push(esc(se.repRange) + " reps");
      html += '<div style="font-size:11px;color:var(--text-faint);margin-top:1px;">Mục tiêu: <span class="mono">' + bits.join(" × ") + "/set</span></div>";

    html += '<div><div class="info-card-label" style="margin-bottom:4px;">Mục tiêu Kg</div><input id="ex-kg-input-' + exIdx + '" class="input ex-edit-field" inputmode="decimal" placeholder="VD: 40" value="' + esc(se.targetWeight || "") + '" /></div>';
    html += '<div><div class="info-card-label" style="margin-bottom:4px;">Mục tiêu Reps</div><input id="ex-reps-input-' + exIdx + '" class="input ex-edit-field" placeholder="VD: 6-10" value="' + esc(se.repRange || "") + '" /></div>';
    html += "</div>";
    html += '<div style="margin-bottom:10px;"><div class="info-card-label" style="margin-bottom:4px;">Mô tả</div>';
    html += '<textarea id="ex-note-input-' + exIdx + '" class="input ex-edit-field" rows="2" placeholder="Ghi chú thêm cho bài này..." style="font-size:13px;resize:none;">' + esc(se.note || "") + "</textarea></div>";

  if (mode === "custom") {
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">';
    html += '<span style="font-size:11px;color:var(--text-faint);white-space:nowrap;">Đơn vị</span>';
    html += '<input class="input custom-unit-input" data-ex="' + exIdx + '" style="flex:1;padding:6px 10px;font-size:13px;" placeholder="vd: vòng, phút plank, bpm..." value="' + esc(se.customUnit || "") + '" />';

  se.sets.forEach((st, setIdx) => {
    html += '<div class="set-row" data-ex="' + exIdx + '" data-set="' + setIdx + '" style="display:grid;grid-template-columns:' + cols + ';gap:6px;align-items:center;margin-bottom:6px;">';

      html += '<input class="set-input inp-weight ' + (st.done ? "done" : "") + '" inputmode="decimal" value="' + esc(String(st.weight || "")) + '" placeholder="0" />';
      html += '<input class="set-input inp-reps ' + (st.done ? "done" : "") + '" inputmode="numeric" value="' + esc(String(st.reps || "")) + '" placeholder="0" />';

      html += '<input class="set-input inp-calories ' + (st.done ? "done" : "") + '" inputmode="decimal" value="' + esc(String(st.calories || "")) + '" placeholder="0" />';
    } else {
      html += '<input class="set-input inp-value ' + (st.done ? "done" : "") + '" inputmode="decimal" value="' + esc(String(st.value || "")) + '" placeholder="0" />';
    }
    html += '<button type="button" class="set-del" data-action="remove-set" data-ex="' + exIdx + '" data-set="' + setIdx + '" aria-label="Xoá set">✕</button></div>';
  });
  html += '<div style="display:flex;gap:8px;margin-top:8px;"><button type="button" class="link-btn" data-action="add-set" data-ex="' + exIdx + '">+ Thêm set</button></div></div>';
  return html;

/* ============ PICKER OVERLAY ============ */
function getDateGroups() {
  const dates = Array.from(new Set(state.workouts.map((w) => w.date)));
  dates.sort((a, b) => new Date(b) - new Date(a));
  return dates;
}
function getOrCreateDayWorkout(date) {
  const matches = state.workouts.filter((w) => w.date === date);
  if (matches.length === 0) {
    const w = { id: uid("w"), name: "Buổi tự ghi", date: date, durationSec: 0, exercises: [] };
    state.workouts.push(w);
    return w;
  }
  if (matches.length === 1) return matches[0];
  const primary = matches[0];
  for (let i = 1; i < matches.length; i++) primary.exercises = primary.exercises.concat(matches[i].exercises);
  state.workouts = state.workouts.filter((w) => w.date !== date || w === primary);
  return primary;
}
function getViewingWorkout() {
  if (state.viewingWorkoutId) return state.workouts.find((w) => w.id === state.viewingWorkoutId) || null;
  if (state.dataExpandedDate) return getOrCreateDayWorkout(state.dataExpandedDate);
  return null;
}
function getEditableExercisesRef() {
  if (state.activeSession) return state.activeSession.exercises;

}
function getAlreadyPicked() {

  if (state.picker.context === "routine") return state.editingRoutine.exercises.map((e) => e.exerciseId);
  if (state.picker.context === "history") { const w = getViewingWorkout(); return w ? w.exercises.map((e) => e.exerciseId) : []; }
  return [];
}
function renderPicker() {

/* ============ MUTATIONS ============ */
function isSetComplete(mode, st) {
  if (mode === "cardio") return !!(st.duration || st.distance || st.calories);
  if (mode === "custom") return !!st.value;
  return !!(st.weight && st.reps);
}
function syncActiveInputsToState() {
  const exs = getEditableExercisesRef();
  if (!exs) return;
  document.querySelectorAll(".set-row").forEach((row) => {
    const exIdx = +row.dataset.ex, setIdx = +row.dataset.set;
    const ex = exs[exIdx];
    if (!ex) return;
    const st = ex.sets[setIdx];
    if (!st) return;
    const mode = ex.mode || "strength";
    if (mode === "strength") {
      const w = row.querySelector(".inp-weight"), r = row.querySelector(".inp-reps");
      if (w) st.weight = w.value;
      if (r) st.reps = r.value;
    } else if (mode === "cardio") {
      const d = row.querySelector(".inp-duration"), ds = row.querySelector(".inp-distance"), c = row.querySelector(".inp-calories");
      if (d) st.duration = d.value;
      if (ds) st.distance = ds.value;
      if (c) st.calories = c.value;
    } else {
      const v = row.querySelector(".inp-value");
      if (v) st.value = v.value;
    }
    st.done = isSetComplete(mode, st);
  });
  document.querySelectorAll(".custom-unit-input").forEach((inp) => {
    const ex = exs[+inp.dataset.ex];
    if (ex) ex.customUnit = inp.value;
  });
  exs.forEach((ex, i) => {
    const nameEl = document.getElementById("ex-name-input-" + i);
    if (nameEl) ex.name = nameEl.value;
    const kgEl = document.getElementById("ex-kg-input-" + i);
    if (kgEl) ex.targetWeight = kgEl.value;
    const repsEl = document.getElementById("ex-reps-input-" + i);
    if (repsEl) ex.repRange = repsEl.value;
    const noteEl = document.getElementById("ex-note-input-" + i);
    if (noteEl) ex.note = noteEl.value;
  });
}
function updateRowDOM(exIdx, setIdx, mode, st) {
  const row = document.querySelector('.set-row[data-ex="' + exIdx + '"][data-set="' + setIdx + '"]');
  if (!row) return;
  if (mode === "cardio") {
    const d = row.querySelector(".inp-duration"), ds = row.querySelector(".inp-distance"), c = row.querySelector(".inp-calories");
    if (d) d.value = st.duration || "";
    if (ds) ds.value = st.distance || "";
    if (c) c.value = st.calories || "";
  } else if (mode === "custom") {
    const v = row.querySelector(".inp-value");
    if (v) v.value = st.value || "";
  } else {
    const w = row.querySelector(".inp-weight"), r = row.querySelector(".inp-reps");
    if (w) w.value = st.weight || "";
    if (r) r.value = st.reps || "";
  }
  row.querySelectorAll(".set-input").forEach((inp) => inp.classList.toggle("done", !!st.done));
}
function propagateFirstRowToBlanks(exIdx) {
  const exs = getEditableExercisesRef();
  if (!exs || !exs[exIdx]) return;
  const ex = exs[exIdx];
  if (ex.sets.length < 2) return;
  const mode = ex.mode || "strength";
  const first = ex.sets[0];
  for (let i = 1; i < ex.sets.length; i++) {
    const st = ex.sets[i];
    if (st.auto === false) continue;
    if (mode === "cardio") { st.duration = first.duration; st.distance = first.distance; st.calories = first.calories; }
    else if (mode === "custom") { st.value = first.value; }
    else { st.weight = first.weight; st.reps = first.reps; }
    st.auto = true;
    st.done = isSetComplete(mode, st);
    updateRowDOM(exIdx, i, mode, st);
  }
}
function pickExercise(id, name) {
  const mode = defaultModeForExercise(id);
  if (state.picker.context === "active") {
    if (state.activeSession.exercises.some((e) => e.exerciseId === id)) { state.picker = null; return; }
    state.activeSession.exercises.push({ exerciseId: id, name: name, mode: mode, sets: [emptySetForMode(mode)] });
  } else if (state.picker.context === "routine") {
    if (state.editingRoutine.exercises.some((e) => e.exerciseId === id)) { state.picker = null; return; }
    state.editingRoutine.exercises.push({ exerciseId: id, name: name, targetSets: 3 });
  } else if (state.picker.context === "history") {
    const w = getViewingWorkout();
    if (!w) { state.picker = null; return; }
    if (w.exercises.some((e) => e.exerciseId === id)) { state.picker = null; return; }
    w.exercises.push({ exerciseId: id, name: name, mode: mode, sets: [emptySetForMode(mode)], origin: "added" });
  }
  state.picker = null;
}
function createExerciseFromPicker() {
  const nameInput = document.getElementById("picker-new-name");
  const name = nameInput ? nameInput.value.trim() : "";
  if (!name) return;
  const group = (state.picker && state.picker.newGroup === "Cardio") ? "Cardio" : "Tuỳ chỉnh";
  const ex = { id: uid("e"), name: name, group: group, type: group === "Cardio" ? "cardio" : "strength" };
  state.exercises.push(ex);
  pickExercise(ex.id, ex.name);
}
function startEmpty() {
  const w = { id: uid("w"), name: "Buổi tập trống", date: todayStr(), startedAt: Date.now(), durationSec: 0, exercises: [] };
  state.workouts.push(w);
  state.activeSession = w;
}
function startFromRoutine(id) {
  const r = state.routines.find((x) => x.id === id);
  if (!r) return;
  const w = {
    id: uid("w"), name: r.name, date: todayStr(), startedAt: Date.now(), durationSec: 0,
    exercises: r.exercises.map((e) => {
      const mode = defaultModeForExercise(e.exerciseId);
      return {
        exerciseId: e.exerciseId, name: e.name, repRange: e.repRange || null, targetWeight: e.targetWeight || null, note: e.note || null, mode: mode,
        sets: Array.from({ length: e.targetSets || 3 }).map(() => emptySetForMode(mode)),
      };
    }),
  };
  state.workouts.push(w);
  state.activeSession = w;
}
function finishWorkout() {
  const s = state.activeSession;
  s.durationSec = Math.round((Date.now() - s.startedAt) / 1000);
  s.exercises = s.exercises.map((e) => ({ ...e, origin: e.origin || "routine", sets: e.sets.filter((x) => x.done) })).filter((e) => e.sets.length > 0);
  if (s.exercises.length === 0) {
    state.workouts = state.workouts.filter((w) => w.id !== s.id);
  }
  state.activeSession = null;
  state.tab = "history";
}
function syncRoutineEditorToState() {
  if (!state.editingRoutine) return;
  const nameEl = document.getElementById("routine-name-input");
  if (nameEl) state.editingRoutine.name = nameEl.value;
  state.editingRoutine.exercises.forEach((e, i) => {
    const nEl = document.getElementById("routine-ex-name-" + i);
    if (nEl) e.name = nEl.value;
    const kgEl = document.getElementById("routine-ex-kg-" + i);
    if (kgEl) e.targetWeight = kgEl.value;
    const repsEl = document.getElementById("routine-ex-reps-" + i);
    if (repsEl) e.repRange = repsEl.value;
    const noteEl = document.getElementById("routine-note-input-" + i);
    if (noteEl) e.note = noteEl.value;
  });
}
function closeRoutineEditor() {
  const r = state.editingRoutine;
  if (r) {
    if (!r.name || !r.name.trim()) r.name = "Routine mới";
    if (r.exercises.length === 0) state.routines = state.routines.filter((x) => x.id !== r.id);
  }
  state.editingRoutine = null;
  state.routineEditExpandedIndex = null;
}

/* ============ ACTION DISPATCH ============ */
function handleAction(action, el) {
  switch (action) {
    case "select-tab": state.tab = el.dataset.tab; break;
    case "toggle-theme": state.theme = state.theme === "dark" ? "light" : "dark"; applyTheme(); break;
    case "hero-metric": state.heroMetric = el.dataset.metric; break;
    case "log-past-workout": {
      getOrCreateDayWorkout(todayStr());
      state.dataExpandedDate = todayStr();
      state.picker = { context: "history", newGroup: "Tuỳ chỉnh" };
      break;
    }
    case "start-empty": startEmpty(); break;
    case "start-routine": startFromRoutine(el.dataset.id); break;
    case "cancel-workout": {
      if (state.activeSession) state.workouts = state.workouts.filter((w) => w.id !== state.activeSession.id);
      state.activeSession = null;
      state.picker = null;
      break;
    }
    case "finish-workout": finishWorkout(); state.picker = null; break;
    case "open-picker": state.picker = { context: el.dataset.context, newGroup: "Tuỳ chỉnh" }; break;
    case "close-picker": state.picker = null; break;
    case "picker-new-group": state.picker.newGroup = el.dataset.group; break;
    case "picker-pick": pickExercise(el.dataset.id, el.dataset.name); break;
    case "picker-create": createExerciseFromPicker(); break;
    case "add-set": {
      const exs = getEditableExercisesRef();
      const ex = exs[+el.dataset.ex];
      const mode = ex.mode || "strength";
      const sets = ex.sets;
      const last = sets[sets.length - 1];
      const fresh = emptySetForMode(mode);
      if (last) { Object.keys(fresh).forEach((k) => { if (k !== "done" && last[k] !== undefined) fresh[k] = last[k]; }); }
      fresh.auto = true;
      sets.push(fresh);
      break;
    }
    case "set-mode": {
      const exs = getEditableExercisesRef();
      const ex = exs[+el.dataset.ex];
      ex.mode = el.dataset.mode;
      ex.sets = [emptySetForMode(ex.mode)];
      if (ex.mode !== "custom") ex.customUnit = "";
      break;
    }
    case "remove-set": {
      const exIdx = +el.dataset.ex, setIdx = +el.dataset.set;
      const exs = getEditableExercisesRef();
      const ex = exs[exIdx];
      ex.sets.splice(setIdx, 1);
      if (ex.sets.length === 0) exs.splice(exIdx, 1);
      break;
    }
    case "remove-exercise": {
      const exs0 = getEditableExercisesRef();
      const i0 = +el.dataset.ex;
      exs0.splice(i0, 1);
      if (state.setCardExpandedIndex === i0) state.setCardExpandedIndex = null;
      else if (state.setCardExpandedIndex > i0) state.setCardExpandedIndex--;
      break;
    }
    case "ex-toggle-edit": {
      const i = +el.dataset.ex;
      state.setCardExpandedIndex = state.setCardExpandedIndex === i ? null : i;
      break;
    }
    case "ex-move-up": {
      const i = +el.dataset.ex;
      const exs = getEditableExercisesRef();
      if (i > 0) {
        const tmp = exs[i - 1]; exs[i - 1] = exs[i]; exs[i] = tmp;
        if (state.setCardExpandedIndex === i) state.setCardExpandedIndex = i - 1;
        else if (state.setCardExpandedIndex === i - 1) state.setCardExpandedIndex = i;
      }
      break;
    }
    case "ex-move-down": {
      const i = +el.dataset.ex;
      const exs = getEditableExercisesRef();
      if (i < exs.length - 1) {
        const tmp = exs[i + 1]; exs[i + 1] = exs[i]; exs[i] = tmp;
        if (state.setCardExpandedIndex === i) state.setCardExpandedIndex = i + 1;
        else if (state.setCardExpandedIndex === i + 1) state.setCardExpandedIndex = i;
      }
      break;
    }
    case "data-toggle-day": {
      const date = el.dataset.date;
      if (state.dataExpandedDate === date) {
        const w = getOrCreateDayWorkout(date);
        if (w && w.exercises.length === 0) state.workouts = state.workouts.filter((x) => x.id !== w.id);
        state.dataExpandedDate = null;
      } else {
        getOrCreateDayWorkout(date);
        state.dataExpandedDate = date;
      }
      break;
    }
    case "view-day": state.tab = "history"; state.dataExpandedDate = el.dataset.date; getOrCreateDayWorkout(el.dataset.date); break;
    case "delete-day": {
      const date = el.dataset.date;
      if (confirm("Xoá toàn bộ dữ liệu ngày " + fmtDate(date) + "?")) {
        state.workouts = state.workouts.filter((w) => w.date !== date);
        if (state.dataExpandedDate === date) state.dataExpandedDate = null;
      }
      break;
    }
    case "delete-workout": state.workouts = state.workouts.filter((w) => w.id !== el.dataset.id); break;
    case "select-progress": state.progressSelectedId = el.dataset.id; break;
    case "new-routine": {
      const nr = { id: uid("r"), name: "Routine mới", exercises: [] };
      state.routines.push(nr);
      state.editingRoutine = nr;
      state.routineEditExpandedIndex = null;
      break;
    }
    case "edit-routine": {
      state.editingRoutine = state.routines.find((r) => r.id === el.dataset.id) || null;
      state.routineEditExpandedIndex = null;
      break;
    }
    case "delete-routine": state.routines = state.routines.filter((r) => r.id !== el.dataset.id); break;
    case "routine-move-up": {
      const i = state.routines.findIndex((r) => r.id === el.dataset.id);
      if (i > 0) { const tmp = state.routines[i - 1]; state.routines[i - 1] = state.routines[i]; state.routines[i] = tmp; }
      break;
    }
    case "routine-move-down": {
      const i = state.routines.findIndex((r) => r.id === el.dataset.id);
      if (i !== -1 && i < state.routines.length - 1) { const tmp = state.routines[i + 1]; state.routines[i + 1] = state.routines[i]; state.routines[i] = tmp; }
      break;
    }
    case "close-routine-editor": closeRoutineEditor(); break;
    case "routine-toggle-edit": {
      const i = +el.dataset.i;
      state.routineEditExpandedIndex = state.routineEditExpandedIndex === i ? null : i;
      break;
    }
    case "routine-ex-move-up": {
      const i = +el.dataset.i;
      if (i > 0) {
        const exs = state.editingRoutine.exercises;
        const tmp = exs[i - 1]; exs[i - 1] = exs[i]; exs[i] = tmp;
        if (state.routineEditExpandedIndex === i) state.routineEditExpandedIndex = i - 1;
        else if (state.routineEditExpandedIndex === i - 1) state.routineEditExpandedIndex = i;
      }
      break;
    }
    case "routine-ex-move-down": {
      const i = +el.dataset.i;
      const exs = state.editingRoutine.exercises;
      if (i < exs.length - 1) {
        const tmp = exs[i + 1]; exs[i + 1] = exs[i]; exs[i] = tmp;
        if (state.routineEditExpandedIndex === i) state.routineEditExpandedIndex = i + 1;
        else if (state.routineEditExpandedIndex === i + 1) state.routineEditExpandedIndex = i;
      }
      break;
    }
    case "routine-remove-exercise": {
      const i = +el.dataset.i;
      state.editingRoutine.exercises.splice(i, 1);
      if (state.routineEditExpandedIndex === i) state.routineEditExpandedIndex = null;
      break;
    }
    case "routine-set-plus": state.editingRoutine.exercises[+el.dataset.i].targetSets++; break;
    case "routine-set-minus": {
      const i = +el.dataset.i;
      state.editingRoutine.exercises[i].targetSets = Math.max(1, state.editingRoutine.exercises[i].targetSets - 1);
      break;
    }
  }
}

/* ============ RENDER ROOT ============ */
function render() {
  const root = document.getElementById("app");
  if (!state.loaded) {
    root.innerHTML = '<div class="frame" style="display:flex;align-items:center;justify-content:center;"><span class="mono" style="color:var(--text-faint);">Đang tải...</span></div>';
    return;
  }
  let body;
  if (state.activeSession) {
    body = renderActiveWorkout();
  } else if (state.tab === "log") body = renderLogTab();
  else if (state.tab === "history") body = renderHistoryTab();
  else if (state.tab === "progress") body = renderProgressTab();
  else body = renderRoutinesTab();

  let html = '<div class="frame"><div class="screen">' + body + "</div></div>";
  root.innerHTML = html;

  if (state.picker) {
    root.insertAdjacentHTML("beforeend", renderPicker());
  }
  attachPostRenderHandlers();
}
function attachPostRenderHandlers() {
  const searchEl = document.getElementById("picker-search");
  if (searchEl) {
    searchEl.addEventListener("input", () => {
      const q = searchEl.value.toLowerCase();
      document.querySelectorAll(".picker-group").forEach((g) => {
        let any = false;
        g.querySelectorAll(".picker-item").forEach((item) => {
          const show = item.dataset.search.includes(q);
          item.style.display = show ? "" : "none";
          if (show) any = true;
        });
        g.style.display = any ? "" : "none";
      });
    });
  }
}
function renderAndPersist() {
  const scrollIds = ["tab-scroll", "detail-scroll", "picker-scroll"];
  const pos = {};
  scrollIds.forEach((id) => { const el = document.getElementById(id); if (el) pos[id] = el.scrollTop; });
  render();
  scrollIds.forEach((id) => { const el = document.getElementById(id); if (el && pos[id] !== undefined) el.scrollTop = pos[id]; });
  if (state.loaded) scheduleSave();
}

/* ============ EVENTS ============ */
function updateFinishButtonState() {
  if (!state.activeSession) return;
  const btn = document.querySelector('[data-action="finish-workout"]');
  if (!btn) return;
  const canFinish = state.activeSession.exercises.length > 0 && state.activeSession.exercises.some((e) => e.sets.some((x) => x.done));
  if (canFinish) btn.removeAttribute("disabled");
  else btn.setAttribute("disabled", "");
}
document.getElementById("app").addEventListener("change", (e) => {
  if (e.target.classList.contains("day-icon-input-hidden")) {
    handleDayIconFile(e);
    return;
  }
  if (state.editingRoutine) {
    syncRoutineEditorToState();
    scheduleSave();
    return;
  }
  if (e.target.classList.contains("ex-edit-field")) {
    syncActiveInputsToState();
    scheduleSave();
    return;
  }
  const row = e.target.closest(".set-row");
  if (!row) return;
  const exIdx = +row.dataset.ex, setIdx = +row.dataset.set;
  const exs = getEditableExercisesRef();
  if (!exs || !exs[exIdx]) return;
  const ex = exs[exIdx];
  const st = ex.sets[setIdx];
  if (!st) return;
  const mode = ex.mode || "strength";
  if (e.target.classList.contains("inp-weight")) st.weight = e.target.value;
  else if (e.target.classList.contains("inp-reps")) st.reps = e.target.value;
  else if (e.target.classList.contains("inp-duration")) st.duration = e.target.value;
  else if (e.target.classList.contains("inp-distance")) st.distance = e.target.value;
  else if (e.target.classList.contains("inp-calories")) st.calories = e.target.value;
  else if (e.target.classList.contains("inp-value")) st.value = e.target.value;
  else return;
  if (setIdx !== 0) st.auto = false;
  st.done = isSetComplete(mode, st);
  row.querySelectorAll(".set-input").forEach((inp) => inp.classList.toggle("done", !!st.done));
  if (setIdx === 0) propagateFirstRowToBlanks(exIdx);
  updateFinishButtonState();
  scheduleSave();
});

document.getElementById("app").addEventListener("click", (e) => {
  if (e.target.id === "picker-overlay") {
    state.picker = null;
    renderAndPersist();
    return;
  }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.dataset.action === "picker-jump-group") {
    const target = document.getElementById("picker-group-" + el.dataset.group);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (state.activeSession || state.viewingWorkoutId || state.dataExpandedDate) syncActiveInputsToState();
  if (state.editingRoutine) syncRoutineEditorToState();
  handleAction(el.dataset.action, el);
  renderAndPersist();
});

const AUTO_FINISH_MS = 2 * 60 * 60 * 1000; // 2 giờ
setInterval(() => {
  if (state.activeSession) {
    const elapsedMs = Date.now() - state.activeSession.startedAt;
    const el = document.getElementById("timer-display");
    if (el) el.textContent = formatElapsed(elapsedMs);
    if (elapsedMs >= AUTO_FINISH_MS) {
      syncActiveInputsToState();
      finishWorkout();
      renderAndPersist();
    }
  }
}, 1000);

/* ============ INIT ============ */
async function maybeSeedPlan() {
  let seeded = null;
  try {
    seeded = await storageGetRaw(SEED_KEY);
  } catch (e) { seeded = null; }
  if (seeded) return;

  const existingIds = new Set(state.exercises.map((e) => e.id));
  DEFAULT_EXERCISES.forEach((e) => { if (!existingIds.has(e.id)) { state.exercises.push(e); existingIds.add(e.id); } });

  const existingNames = new Set(state.routines.map((r) => r.name));
  const toAdd = SEED_ROUTINES.filter((r) => !existingNames.has(r.name));
  state.routines = [...toAdd, ...state.routines];

  await flushSave(2);
  try { await storageSetRaw(SEED_KEY, "1"); } catch (e) { /* ignore */ }
}

(async function init() {
  const d = await loadData();
  state.exercises = d.exercises && d.exercises.length ? d.exercises : DEFAULT_EXERCISES;
  state.routines = d.routines || [];
  state.workouts = d.workouts || [];
  state.theme = d.theme === "dark" ? "dark" : "light";
  state.dayIcons = d.dayIcons || {};
  applyTheme();
  await maybeSeedPlan();
  state.loaded = true;
  render();
})();
</script>
